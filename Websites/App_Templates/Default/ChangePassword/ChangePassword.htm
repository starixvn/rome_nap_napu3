<form method="post" name="pw">
  <table class="tbllayout" style="width:300px;" cellspacing="1">    
    <tr class="title">
      <td colspan="2">Reset Password: {username}</td>
    </tr>    
    <tr>
      <td class="l b">Password:</td>
      <td class="l">
        <input class="txt" type="password" name="txtPass"></input>
      </td>
    </tr>
    <tr>
      <td class="l b">Confirm Password:</td>
      <td class="l">
        <input class="txt"  type="password" name="txtConfirmPass"></input>
      </td>
    </tr>
    <tr>
      <td class="c" colspan="2">
        <input class="btn" type="submit" value="Submit"></input><input class="btn" type="reset" value="Reset"></input>
      </td>
    </tr>
  </table>
  {hidden}
</form>
