<div>
  <span class="error-message" id="errMsg" name="errMsg"></span>
  <table>    
    <tr>
      <td>
        <font color="#8C57A1">To protect your account, you need to change your password periodically.</font>
      </td>
    </tr>
  </table>    
  <table class="tbllayout" style="background-color: #eeecee;" cellspacing="1">   
    <tr>      
      <td colspan="2" class="title">Please verify your password </td>      
    </tr>
    <br/>    
    <tr>      
      <td width="40%" class="r pad33">UserName </td>
      <td style="font-weight: bold;" class="pad33">{accname}</td>
    </tr>
    <tr>      
      <td width="40%" class="r pad33">Password </td>
      <td><input type="password" id="password" name="password" onkeypress="return checkKeyPress(event);"/>
      </td>
    </tr>
    <tr>      
      <td colspan="2" class="c">
        <input type="submit" class="btn" id="submit" name="submit" value="Submit"/>        
      </td>
    </tr>
  </table>  
</div>
