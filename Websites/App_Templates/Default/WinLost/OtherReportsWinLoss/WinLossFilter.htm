<div id="header_main">
    <div style="padding-bottom:3px">
        <span style="font-weight:bold;padding-right:20px;padding-left:4px">Search by</span>
        <span style="padding-right:3px">Date:</span>
        <span style="padding-right:40px;">
        <select id="dlDate" style="vertical-align:middle;width:150px" onchange="GetDateTime(this.value)">
            <option value="0" selected="selected">Please Choose One !</option>
            <option value="1">Today</option>
            <option value="2">Yesterday</option>
            <option value="3">Current Week</option>
            <option value="4">Last Week</option>
            <option value="5">Current Month</option>
            <option value="6">Last Month</option>
            <option value="7">Since Last Month</option>
            <option value="8">Specific Date</option>
        </select>
        </span>
        <span style="padding-right:20px;">From:</span>
        <span style="padding-right:50px">
            {FromDateCal}
        </span>
        <span style="padding-right:3px;">To:</span>
        <span style="padding-left:5px;">
            {ToDateCal}
        </span>
    </div>
    <div style="padding-bottom:10px">
        <span style="padding-right:74px">&nbsp;</span>
        <span style="padding-right:3px">Sport:</span>
        <span style="padding-right:40px;">
            <select id="dlSport" style="vertical-align:middle;width:150px">
                <option value="-1">Please Choose One !</option>
                <option value="0">Sportsbook</option>
                <option value="151">Racing</option>
            </select>
        </span>
        <span style="padding-right:3px;">Currency:</span>
        <span>
            <select id="dlCurrency" style="vertical-align:middle;width:150px">
                <option value="0">Please Choose One !</option>
                <option value="-1">Base Currency-USD</option>
                <option value="-2">Base Currency-RM</option>
                <!--CurrencyOption-->
                <option value="{optionvalue}">{optiondisplay}</option>
                <!--/CurrencyOption-->
            </select>
        </span>
    </div>
    <div>
        <span style="font-weight:bold;padding-right:15px;padding-left:4px">Report by</span>
        <span style="padding-right:5px"><input type="radio" name="RdReportBy" id="rdDaily" checked="checked" value="1" /><label for="rdDaily">Daily</label></span>
        <span style="padding-right:5px"><input type="radio" name="RdReportBy" id="rdMonthly"  value="2" /><label for="rdMonthly">Monthly</label></span>
        <span style="padding-right:60px"><input type="radio" name="RdReportBy" id="rdSport"  value="3" /><label for="rdSport">Sport</label></span>
        <span style="padding-right:5px;vertical-align:middle;">
            <input id="btnReport" name="btnReport" type="button" value="REPORT" class="btn" onclick="GetDataReport(0)" />
        </span>
        <span style="padding-right:5px;vertical-align:middle;">
            <input id="btnReset" name="btnReset" type="button" value="Reset" class="btn" onclick="DoReset()" />
        </span>
        <span id="GoBackBtn" style="padding-right:5px;vertical-align:middle;display:none">
            <input id="btnBack" name="btnReset" type="button" value="Back To Main" class="btn" onclick="GoBack()" />
        </span>
        <span style='padding-right:20px'>
            <input id="btnExport" name="btnExport" title="Export to Excel" class='btnExcel' id='btnExport' name='btnExport' value='   ' onclick='ExportToExcel();' type='button' />
          </span>
        <span style="vertical-align:middle;">
            <img id='inProgressBar' name='inProgressBar' width="16px" height="16px" style="display:none"  src="../../../../App_Themes/Images/ajax-loader.gif"  alt=""/>
            <input type="hidden" id="dateOption" />
            <input type="hidden" id="sportOption" />
            <input type="hidden" id="reportByOption" />
            <input type="hidden" id="currencyOption" />
            <input type="hidden" id="reportDetail" value="0" />
            <input type="hidden" id="fromdate" />
            <input type="hidden" id="todate" />
            <input type="hidden" id="currencyIndex" />
            <input type="hidden" id="currencyName" />
            <input type="hidden" id="fromdatedetail" />
            <input type="hidden" id="todatedetail" />
            <input type="hidden" id="sportOptionDetail" />
            <input type="hidden" id="currencyOptionDetail" />
            
        </span>
    </div>
</div>
<div style="padding-bottom:3px;"></div>
