<form action="DeleteTrans.aspx" method="post">
  <table border="0px">
    <tr>
      <td>USERNAME:</td>
      <td>
        <input type='text' name='username' id='username' />
      </td>
    </tr>
    <tr>
      <td>PASSWORD:</td>
      <td>
        <input type='password' name='userpwd' id='userpwd' />
      </td>
    </tr>
    <tr>
      <td>From RefNo:</td>
      <td>
        <input type='text' class='no-border' name='frefno' readonly='true' value='{FromRefno}' />
      </td>
    </tr>
    <tr>
      <td>To RefNo:</td>
      <td>
        <input type='text' class='no-border' name='trefno' readonly='true' value='{ToRefno}' />
      </td>
    </tr>
    <tr>
      <td>Match ID:</td>
      <td>
        <input type='text' class='no-border' name='matchid' id='matchid' readonly='true' value='{MatchId}' />
      </td>
    </tr>
    <tr>
      <td>Bet Type:</td>
      <td>
        <!--<input type='text' class='no-border' readonly='true' value='{BettypeStr}' />-->
        {BettypeStr}
        <input type='hidden' name='bettype' readonly='true' value='{Bettype}' />        
      </td>
    </tr>
    <tr>
      <td>Bet Team:</td>
      <td>
        <input type='text' class='no-border' name='betteam' readonly='true' value='{Betteam}' />
      </td>
    </tr>
    <tr>
      <td>HDP</td>
      <td>
        <input type='text' class='no-border' name='hdp' readonly='true' value='{Hdp}' />
      </td>
    </tr>
    <tr>
      <td>Type:</td>
      <td>
        <input type='text' class='no-border' name='type' readonly='true' value='{type}' />
      </td>
    </tr>
  </table>
  <div id='ErrorMessage' class='error-message'></div>
  <table border="0px">
    <tr>
      <th colspan="3" bgcolor="#88aaff">Please include "@@" in message content for replace ticket numbers</th>
    </tr>
    <tr bgcolor="#ADADAD" class="tableBw">
      <th  align="center">
        <span style="color:Red;">*</span>Message En
      </th>
      <th  align="center">
        <span style="color:Red;">*</span>Message Ch
      </th>
      <th align="center">Message Cs</th>
    </tr>
    <tr>
      <td>
        <textarea rows="10" id="men" name="men" cols="36"></textarea>
      </td>
      <td>
        <textarea rows="10" id="mch" name="mch" cols="36"></textarea>
      </td>
      <td>
        <textarea rows="10" id="mcs" name="mcs" cols="36"></textarea>
      </td>
    </tr>
    <tr>
      <th colspan="3" bgcolor="#88aaff">
        <a id="other_display" onclick="hideLanguage(this)" href="#">
          <span style="color: Black;">Other Language</span> [+]
        </a>
      </th>
    </tr>
    <tr bgcolor="#ADADAD" class="tableBw" id="otherLanguage_title" style="display:none;">
      <th  align="center">Message Th</th>
      <th  align="center">Message It</th>
      <th  align="center">Message Jp</th>
    </tr>
    <tr id="otherLanguage_content" style="display:none;">
      <td>
        <textarea rows="10" id="mth" name="mth" cols="36"></textarea>
      </td>
      <td>
        <textarea rows="10" id="mit" name="mit" cols="36"></textarea>
      </td>
      <td>
        <textarea rows="10" id="mjp" name="mjp" cols="36"></textarea>
      </td>
    </tr>
  </table>
  <table border="0px" style="margin-top:6px;">
    <tr>
      <td colspan="2" class='c'>
        <input class="btn" type='submit' value='Delete' onclick='return on_delete();' />
      </td>
    </tr>
    <tr>
      <td colspan='2'>
       
        <input type='hidden' id='DelOption' name='DelOption'></input>
        <input type='hidden' id='transids' name='transids'></input>
        <input type='hidden' id='DelOption_BD' name='DelOption_BD'></input>
        <input type='hidden' id='transids_BD' name='transids_BD'></input>
        <input type='hidden' id='DelOption_12EU' name='DelOption_12EU'></input>
        <input type='hidden' id='transids_12EU' name='transids_12EU'></input>
      </td>
    </tr>
  </table>
</form>
