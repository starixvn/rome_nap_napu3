<form id="frmSpecialDelete">
    <table border="0px" class="table">
    <!--confirm-->
      <tr style="">
        <td colspan="2" class="l">
          <span style="color:#d84e1f;font-weight:bold;font-size:9pt;">{confirm-msg}</span>          
        </td>
      </tr>
      <!--/confirm-->
		<tr>
		    <td colspan="2">
		        <table width="700px" border="0">
		            <tr>
		                <td style="width:60px" class="b">Match ID:</td>
		                <td style="width:100px" align="left"><input type="text" size="12" maxlength="12" id="matchid" name="matchid" /></td>
		                <td style="width:30px"></td>
		                <td style="width:170px" class="b">Date Starting Time (GMT+8):</td>
			            <td> <input type="text" id="txtdate" class="txtcalendar" readonly style="cursor: pointer;" /></td>			            
			            <td style="width:30px"></td>
		            </tr>
		        </table>
		    </td>
		</tr> 
		
		<tr>
			<td colspan="2">                
			    {newbt}
			</td>
		</tr>    		
		<tr style="height:20px;">
			<td colspan="2">
				<b>Advanced mode:</b>
			</td>
		</tr>
		
		<tr style="height:20px;">
			<td colspan="2">			    
				 <table style="margin-left:20px;">
				    <tr id="trHDP" style="height:20px;">
				        <td>Type for HDP, 1st HDP, Over/Under, 1st Over/Under, Odd/Even, 1st Odd/Even :</td>				        
				        <td>
				            <select id="ddlBetTeam1378" name="ddlBetTeam1378">                                
                                <option value="All">All</option>                                
					            <option value="h">Home/Over</option>
					            <option value="a">Away/Under</option>
				            </select>				
				        </td>
				        <td align="center" style="width:120px;">HDP:&nbsp;<input type="text" id="hdp" name="hdp" size="5" maxlength="5"></input></td>
				    </tr>
				    <tr id="tr1X2" style="height:20px;">
				        <td>Type for FT.1X2, 1st 1X2 : </td>					        
				        <td>
				            <select id="ddlBetTeam515" name="ddlBetTeam515">
                                <option value="All">All</option>                                
					            <option value="1">1</option>
					            <option value="X">X</option>
					            <option value="2">2</option>
				            </select>
				        </td>		
				        <td></td>	        
				    </tr>
				    <tr id="trCS" style="height:20px;">
				        <td align="left">Type for Correct Score:</td>				        
				        <td align="left" colspan="2"><span id="spErrCS" class="error-message"></span> </td>
				    </tr>				   
				 </table>
				 <div style="margin-left:20px;">
				 {CS-Betteam}
				 </div>
			</td>
		</tr>
		<tr style="display:none;">
			<td colspan="2" class="c">				                
                <input type="hidden" id="bettype" name="bettype" />
                <input type="hidden" id="bettypename" name="bettypename" />
                <input type="hidden" id="betteam4" name="betteam4" />
			</td>
		</tr>
	</table>
</form>
