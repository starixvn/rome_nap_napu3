<table class="tbllayout" cellspacing="1">
  <!--header-->
  <tr class="title">
    <td class="c" style="width:20px">No</td>
    <td class="c" style="width:80px">UserName</td>
    <td class="c" style="width:150px">Date</td>    
    <td class="c" style="width:400px">Choice</td>
    <td class="c" style="width:50px">Stake</td>
    <td class="c" style="width:80px">Currency</td>
  </tr>
  <!--/header-->

  <!--content-->
  <tr class="{odd_even}">
    <td class="c">{No}</td>
    <td class="c">{UserName}</td>
    <td class="c">Ref No: {RefNo} <br> {Transdate}</td>    
    <td class="r">{Choice}</td>
    <td class="c">{Stake}</td>
    <td class="c">{Currency}</td>
  </tr>
  <!--/content-->

  <!--nodata-->
  <tr>
    <td colspan="6" class="c">There is no information available.</td>
  </tr>
  <!--/nodata-->
</table>
