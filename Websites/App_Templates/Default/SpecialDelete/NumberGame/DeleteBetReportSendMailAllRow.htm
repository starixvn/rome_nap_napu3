<tr align="Center" valign="Middle" style="background-color:{bgcolor};height:25px;">

  <td>{username}</td>  
  <td>{refno}</td>

  <!--betype-choice-->
  <td>{bettype}</td>
  <td>{bet}</td>
  <!--/betype-choice-->
  <td><span style="color:Blue; font-weight:bold">{odds}</span><div style="font-weight:bold">{OddsType}</div></td>

  <td style="text-align:right">{winloss}<br/>{comm}</td>
