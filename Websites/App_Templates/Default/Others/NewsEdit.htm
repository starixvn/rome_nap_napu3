<div id="news">
    <table width="100%" border="0" cellspacing="0" cellpadding="0">
        <tr>
            <td width="6%" height="25" class="date">
                Title
            </td>
            <td height="25" colspan="2" align="left" valign="top">
                <input style="width: 300px;" type="text" id="NewsTitleTextBox" name="NewsTitleTextBox"
                    value="{NewsTitle}" />
            </td>
        </tr>
        <tr>
            <td height="25" class="date">
                Date
            </td>
            <td height="25" colspan="2" align="left" valign="middle">
                <div class="date_input_container">
                    <input style="width: 120px;" type="text" name="NewsDateTextBox" id="NewsDateTextBox"
                        value="{NewsDate}" readonly />
                </div>
                <div class="calendar_container" >
                    <input onclick="return false;" alt="" id="NewsDateTextBox_Trigger" title="Date selector"
                        width="18" height="17" src="../../App_Themes/Images/calendar.gif" type="image" class="img-date-selector" />
                </div>
            </td>
        </tr>
        <tr>
            <td height="20" class="date">
                Content
            </td>
            <td colspan="2">
                &nbsp;
            </td>
        </tr>
        <tr>
            <td height="20" colspan="3">
                <textarea id="NewsContentTextArea" name="NewsContentTextArea" cols="70" rows="25"> {NewsContent} </textarea>
            </td>
        </tr>
        <tr id="divEditNewsErrorContainer" style="display: none;">
            <td colspan="3">
                <div id="divEditNewsErrorMsg" class="errMsg">
                    &nbsp</div>
            </td>
        </tr>
        <tr>
            <td height="20">
                &nbsp;
            </td>
            <td width="13%">
                &nbsp;
            </td>
            <td class="buttonbar">
                <a href="javascript:CancelNews({NewsID});" class="btn" onclick="">Cancel</a> <a href="javascript:ResetNews({NewsID});"
                    class="btn" onclick="ResetNews({NewsID});">Reset</a> <a href="javascript:SaveNews({NewsID});"
                        class="btn" onclick="">Save</a>
            </td>
        </tr>
    </table>
</div>
