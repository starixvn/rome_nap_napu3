      <tbody>

            <td colspan="3" class="cap">Latest News</td>
          </tr>
      <!--Rows-->
          <tr>	  
	        <td class="date">{ArchiveDate}</td>
	        <td>  
	            <span class="tittle">
	                {NewsTitle}

      <div>
        {PagerControl}
