<tr class="{odd_even}">

        <div style="width: 80px; overflow: hidden;">
            {currency}
        </div>
    </td>
    <td>
       
        <div style="width: 66px; text-align:center; cursor: pointer;" id="{standardCode}" class="divStandardCode" des="{description}">
             <a>{standardCode}</a>
        </div>
    </td>
    <td class="r">
        <div style="width: 72px">
            {BaseRate}
        </div>
    </td>
    <td class="r">

    <td class="r">

        </div>

    <td class="r new-rate-{odd_even}">

    <td class="r new-rate-{odd_even}">
        <div style="width: 64px">

        </div>
    </td>
    <td class="r new-rate-{odd_even}">
        <div style="width: 64px">
            {EURORate}
        </div>
    </td>
    <td class="r new-rate-{odd_even}">
        <div style="width: 63px">
            {USDRate}
        </div>
    </td>
    <td align="center"> 
        <div onclick="return UpdateExChangeRate({exrateId})"
            style="display: {edit-none}; width:48px" >
            <img src="../App_Themes/Images/icn_edit.png" alt="Edit" style="cursor:pointer;" />
