<table width="248px" border="0" cellspacing="0" cellpadding="0">
    <tr>
        <td class="dot_left b">
            Site:
        </td>
        <td class="dot_left">
            {customersite}
        </td>
    </tr>
    <tr>
        <td class="dot_left b">
            Created Date:
        </td>
        <td class="dot_left">
            {createdate}
        </td>
    </tr>
    <tr>
        <td class="dot_left b">
            Last Login:
        </td>
        <td class="dot_left">
            {LastLogin}
        </td>
    </tr>
    <tr>
        <td class="b dot_left">
            Last Txn:
        </td>
        <td class="dot_left">
            {LastTxn}
        </td>
    </tr>
    <tr>
        <td class="dot_left b">
            <span>Password&nbsp;[<a href="javascript:parent.gotoURL('centerFr','ChangePassword/ChangePassword.aspx?CustID={custid}'); parent.resetMenu();">Change</a>]</span>
        </td>
        <td class="dot_left">
            {PasswordExpiry}
        </td>
    </tr>
    <tr>
        <td class="dot_left b">
            Last Login IP:
        </td>
        <td class="dot_left b">
            <span>{LastLoginIP}</span>
        </td>
    </tr>
    <!--loginoption-->
    <tr>
        <td class="dot_left b">
            Login Options:
        </td>
        <td class="dot_left">
            <span>{loginoptions}</span>
        </td>
    </tr>
    <!--/loginoption-->
    <!--security_code-->
    <tr>
        <td class="dot_left b">
            <span>Security Code&nbsp;[<a href="javascript:parent.gotoURL('centerFr','./CustomerSecurityCode/Index?CustomerName={Username}&RoleId={RoleId}&CustomerId={custid}'); parent.resetMenu();">Change</a>]</span>
        </td>
        <td class="dot_left">
            <span>{last_change_security_code_date}</span>
        </td>
    </tr>
    <!--/security_code-->
</table>
