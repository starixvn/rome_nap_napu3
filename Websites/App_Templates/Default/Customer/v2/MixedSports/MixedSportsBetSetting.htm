<table class="tblcollapse" width="100%" cellpadding="0" cellspacing="0">       
    <tr>
      <td nowrap class="r">
        {minbet-text}&nbsp;
        <input class="copyAll" type="text" maxlength="14" onkeypress="return AllowNumber(event)" id="txtMinbet{sporttype}" name="txtMinbet{sporttype}" value="{minbet{sporttype}-val}" ></input>
        <span class="{mbMin}">
          &gt;=<span id="txtMinbet_Min{sporttype}">{minbet-min-{sporttype}}</span>
        </span>
      </td>
      <td nowrap class="r">
        {maxbet-text}&nbsp;
        <input class="copyAll" type="text" maxlength="14" onkeypress="return AllowNumber(event)" id="txtMaxbet{sporttype}" name="txtMaxbet{sporttype}" value="{maxbet{sporttype}-val}" ></input>
        <span class="{mbMax}">
          &lt;=<span id="txtMaxbet_Max{sporttype}">{maxbet-max-{sporttype}}</span>
        </span>
      </td>
      <td nowrap class="r">
        {maxpermatch-text}&nbsp;
        <input class="copyAll" type="text" maxlength="14" onkeypress="return AllowNumber(event)" id="txtMaxPerMatch{sporttype}" name="txtMaxPerMatch{sporttype}" value="{maxpermatch{sporttype}-val}" ></input>
        <span class="{mpmMin}">
          &gt;=<span id="txtMaxPerMatch_Min{sporttype}">{maxpermatch-min-{sporttype}}</span> and
        </span>
        <span class="{mpmMax}">
          &lt;=<span id="txtMaxPerMatch_Max{sporttype}">{maxpermatch-max-{sporttype}}</span>
        </span>
      </td>
    </tr>
  </table>
