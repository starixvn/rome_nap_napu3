 <!--master-pt1-->
    <tr>
        <td rowspan="4">
            Live
        </td>
        <td class="l">
            {master-live-position}
        </td>
        <td>
            <select class="select-pt copyAll" name="listMNBOUL" id="listMNBOUL">
                {listMNBOULValue}
            </select>
            <input type="button" name="btnReduce1" value=" " class="btn-dec1" onclick="ReducePT('listMNBOUL',1)" />
            <input type="button" name="btnIncrease1" value=" " class="btn-inc1" onclick="IncreasePT('listMNBOUL',1)" />
            <input type="button" name="btnReduce10" value=" " class="btn-dec10" onclick="ReducePT('listMNBOUL',10)" />
            <input type="button" name="btnIncrease10" value=" " class="btn-inc10" onclick="IncreasePT('listMNBOUL',10)" />
        </td>
        <td>
            <select class="select-pt copyfromL" name="listMNBOEL" id="listMNBOEL">
                {listMNBOELValue}
            </select>
        </td>
        <td>
            <select class="select-pt copyfromL" name="listMHLL" id="listMHLL">
                {listMHLLValue}
            </select>
        </td>
        <td>
            <select class="select-pt copyfromL" name="listMNCL" id="listMNCL">
                {listMNCLValue}
            </select>
        </td>
        <!--NG-Key-->
        <td>
            <select class="select-pt copyfromL" name="listMNGL" id="listMNGL">
                {listMNGLValue}
            </select>
        </td>
        <!--/NG-Key-->
        <td rowspan="4">
              <input class="copyAll" type="checkbox" onclick="NumberGameCopyPT('Live');" name="chkCopyNBOUL" id="chkCopyNBOUL" />
               Copy From Over/Under
        </td>
    </tr>
    <!--/master-pt1-->
