{#template MAIN} {#include AgentPT root= $T} {#/template MAIN} {#template AgentPT}
<table class="tblcollapse" style="width: 600px;margin:6px 0px;" id="tblminigame">
    <!--PT-->
    <tr class="title">
        <td colspan="2">
            Position Taking
        </td>
    </tr>
    <!--Master Preset PT -->
    <tr>
        <td class="l w130">
            Master Preset Position
        </td>
        <td>
            <select onchange="On_ChangeMaster();" id="listMPre252" max="{roundNumber($T.maxmpt,2)}" min="0" minupline="{roundNumber($T.minmpt,2)}" name="listMPre252"
                class="select-pt">
                <option value="{roundNumber($T.mpt,2)}" selected="true">{roundNumber($T.mpt,2)}</option>
            </select>
            <input type="button" onclick="ReducePT('listMPre252',1)" class="btn-dec1" value=" "
                name="btnReduce1">
            <input type="button" onclick="IncreasePT('listMPre252',1)" class="btn-inc1" value=" "
                name="btnIncrease1">
            <input type="button" onclick="ReducePT('listMPre252',10)" class="btn-dec10" value=" "
                name="btnReduce10">
            <input type="button" onclick="IncreasePT('listMPre252',10)" class="btn-inc10" value=" "
                name="btnIncrease10">
        </td>
    </tr>
    <!--/Master Preset PT -->
    <!--Agent Max PT-->
    <tr>
        <td class="l" style="">
            Agent Max Position
        </td>
        <td>
            <select id="listAMax252" onchange="On_ChangeAgent()" max="{roundNumber($T.maxapt,2)}" min="{changeMinValue(roundNumber($T.minmpt,2),roundNumber($T.mpt,2))}" name="listAMax252" class="select-pt">
                <option value="{roundNumber($T.apt,2)}" selected="true">{roundNumber($T.apt,2)}</option>
            </select>
            <input type="button" onclick="ReducePT('listAMax252',1)" class="btn-dec1" value=" "
                name="listMHdpD" id="btnR1Hdp">
            <input type="button" onclick="IncreasePT('listAMax252',1)" class="btn-inc1" value=" "
                name="listMHdpD" id="btnI1Hdp">
            <input type="button" onclick="ReducePT('listAMax252',10)" class="btn-dec10" value=" "
                name="listMHdpD" id="btnR10Hdp">
            <input type="button" onclick="IncreasePT('listAMax252',10)" class="btn-inc10" value=" "
                name="listMHdpD" id="btnI10Hdp">
        </td>
    </tr>
    <!--/Agent Max PT-->
     <!--Agent Min-->
    <tr>
        <td class="l" style="">
            Agent Min Position
        </td>
        <td>
            <select id="listAMin252" max="{roundNumber($T.apt,2)}" min="{changeMinValue(roundNumber($T.minmpt,2),roundNumber($T.mpt,2))}" name="listAMin252" class="select-pt">
                <option value="{roundNumber($T.minpt,2)}" selected="true">{roundNumber($T.minpt,2)}</option>
            </select>
            <input type="button" onclick="ReducePT('listAMin252',1)" class="btn-dec1" value=" "
                name="listMHdpD" id="Button1">
            <input type="button" onclick="IncreasePT('listAMin252',1)" class="btn-inc1" value=" "
                name="listMHdpD" id="Button2">
            <input type="button" onclick="ReducePT('listAMin252',10)" class="btn-dec10" value=" "
                name="listMHdpD" id="Button3">
            <input type="button" onclick="IncreasePT('listAMin252',10)" class="btn-inc10" value=" "
                name="listMHdpD" id="Button4">
        </td>
    </tr>
    <!--/Agent Min-->
</table>
<table cellspacing="0" cellpadding="0" border="0">
    <tr>
        <td class="custBtn1">
        </td>
        <td onclick="updateAgent();" class="custBtn2 hand" id="Td1">
            Submit
        </td>
    </tr>
</table>
{#/template AgentPT}
