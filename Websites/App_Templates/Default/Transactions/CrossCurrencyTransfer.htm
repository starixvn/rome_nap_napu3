<!--errorpart-->
<div id="divErrorPart">
    <table class='tbllayout' cellspacing='1' style='width: 696px !important'>
        <tbody>
            <tr class='title'>
                <td style="width:80px">
                    <div>
                        From Cust
                    </div>
                </td>
                <td style="width:80px">
                    <div>
                        To Cust
                    </div>
                </td>
                <td style="width:100px">
                    <div>
                        From Amount
                    </div>
                </td>
                <td style="width:100px">
                    <div>
                        To Amount
                    </div>
                </td>
                <td style="width:100px">
                    <div>
                        Remark
                    </div>
                </td>
                <!--reasonheader-->
                <td style="width:236px">
                    <div>
                        Reason
                    </div>
                </td>
                <!--/reasonheader-->
            </tr>
            <!--content-->
            <tr {rowstyle}>
                <td>
                    <div>
                        {fromcust}
                    </div>
                </td>
                <td>
                    <div>
                        {tocust}
                    </div>
                </td>
                <td>
                    <div style="text-align:right">
                        {fromamount}
                    </div>
                </td>
                <td>
                    <div style="text-align:right">
                        {toamount}
                    </div>
                </td>
                <td>
                    <div style="width:100px; overflow:hidden">
                        {remark}
                    </div>
                </td>
                 <!--reason-->
                <td>
                    <div>
                        {reason}
                    </div>
                </td>
                <!--/reason-->
            </tr>
            <!--/content-->
        </tbody>
    </table>
</div>
<!--/errorpart-->
