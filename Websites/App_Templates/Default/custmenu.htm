<!--havingitem-->
<div onmouseover="$('{submenuid}').style.display='inline';" onmouseout="$('{submenuid}').style.display='none';" style="float:{floatstyle}; width:{menuwidth}px;" >
<span class="{classname}" onclick="{jsfunc}">{name}</span>
    <br />
    <div id="{submenuid}" class="SubCustMenu" style="left:{left}px;"  >
        <table class="l table_Subcustmenu" width="{submenuwidth}" cellpadding="0" cellspacing="0">
          <!--itemsubmenu-->
          <tr>
              <td class="td_SubCustMenu" >
                  <a href="{submenuurl}" target="{itemtarget}">{submenuname}</a>
              </td>
          </tr>
          <!--/itemsubmenu-->
       </table>
    </div>
</div>
<!--/havingitem-->
<!--noitem-->
<div style="float:{floatstyle}; width:{menuwidth}px;" >
    <span class="{classname}" onclick="{jsfunc}">{name}</span>
</div>
<!--/noitem-->
