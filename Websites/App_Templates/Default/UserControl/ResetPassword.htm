<table class="tbllayout" style="width:300;" cellspacing="1">
  <tr class="title">
    <td colSpan="2" >{username}</td>
  </tr>
  <tr>
    <td class="l b">Password:</td>
    <td class="l">
      <input class="txt" type="password" id="password" name="password" />
    </td>
  </tr>
  <tr>
    <td class="l b">Confirm Password:</td>
    <td class="l">
      <input class="txt" type="password" id="confirm" name="confirm" />
    </td>
  </tr>
  <tr>
    <td class="c" colspan="2" >
      <input class="btn"  type="submit" id="accept" name="accept" onclick="return validation();"  value="Submit" />
      <input type="hidden" id="custId" name="custId" value="{custid}" />
    </td>
  </tr> 
</table>
