 <tr bgColor="{rowbg}">
  <td class="c">{username}</td>
  <td class="c">{firstname}</td>
  <td class="c">{lastname}</td>
  <td class="c">{strstatus} {status}</td>
  <td class="c">{[A]}</td>
  <td class="c">{[B]}</td>
  <td class="c">{[C]}</td>
  <td class="c">{[D]}</td>
  <td class="c">{[E]}</td>
  <td class="c">    
    <span style="display:{display1};" class="canchange" onclick="openWindow('ResetPassword.aspx?{resetPassParam}','',300,110);">Password</span>
    <span style="display:{display2};" class="linkdisable">Password</span>    
  </td>      
  <td class="c">
    <span style="display:{display1};" class="canchange" onclick="openWindow('EditUser.aspx?{editParam}','',300,250);">
      <img alt="Edit" title="Edit" src="../{themepath}/images/icn_edit.png" />
    </span>
    <span style="display:{display2};" class="linkdisable">
      <img alt="Edit" src="../{themepath}/images/editdisable.gif" />
    </span>    
  </td>
</tr>
