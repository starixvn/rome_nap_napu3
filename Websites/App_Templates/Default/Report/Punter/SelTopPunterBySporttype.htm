<!--Header-->
    <table>
        <tr>
            <td> 
                <span class="rpt-link" onclick="BackToMain();">Main</span> > 
                <span class="rpt-link" onclick="BackToSelTopPunterByCustID();"> {UserName}</span> > 
                {SportName}
            </td>
            <td>
                <input type="button" onclick="ExportToExcel();" value="&nbsp;&nbsp;" name="btnExport" id="btnExport" class="btnExcel" title="Export to Excel">
            </td>
        </tr>
    </table>
<!--/Header-->
<table id="table" class="tbllayout" cellspacing="1px" cellpadding="1px">
	<thead>
	<tr class="title" id="trHeader">
	        <th style="width:100px">Sporttype</th>
			<th style="width:100px">Bettype</th>
            <th style="width:100px">Winlost</th>
            <th style="width:100px">Turnover</th>
			<th style="width:100px">Margin</th>
		</tr>		
	</thead>
	<tbody>
	    <!--Content-->
		<tr>			    
		    <!--sportname-->
		    <td class="l" rowspan="{rowspan}">{Sportname}</td>
		    <!--/sportname-->
	        <td class="l rpt-link" onclick="SelTopPunterByBettype('{CustId}', '{UserName}', '{Sporttype}', '{Bettype}', '{fdate}', '{tdate}', '{OrderBy}', '{OrderType}');">{BettypeName}</td>	        
            <td class="r">{WinlostIBC}</td>
            <td class="r">{TurnOver}</td>
	        <td class="r rspace">{Margin}</td>
        </tr>        
        <!--/Content-->
	</tbody>
	<tfoot>
	    <!--Footer-->
	    <tr class="report-footer" id="trFooter">	
	        <td class="c" colspan="2">{BettypeName}</td>
            <td class="r">{WinlostIBC}</td>
            <td class="r">{TurnOver}</td>
	        <td class="r">{Margin}</td>
        </tr>        
        <!--/Footer-->
	</tfoot>	
</table>
