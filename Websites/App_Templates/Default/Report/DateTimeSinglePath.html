<script type="text/javascript">
    function SetGetData(id) {
        if (id == 'rdRep') {
            $('#rdRep').attr('checked', true);
            $('#rdMain').attr('checked', false);
            $('#db').val('Rep');
        }
        else {
            $('#rdRep').attr('checked', false);
            $('#rdMain').attr('checked', true);
            $('#db').val('Main');
        }
    }

    function SetEvtGetdate() {
        var MoveBetday = Date.parse($('#MoveBetday').val());
        var SelectDay = Date.parse($('#fdate').val());
        if (SelectDay <= MoveBetday) {
            $('#trGetData').hide();
        }
        else {
            $('#trGetData').show();
        }
    }
</script>
