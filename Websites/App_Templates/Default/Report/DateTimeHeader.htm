<script type="text/javascript">
  function DoPostBack()
  {

  document.getElementById('inProgressBar').style.display = 'block';

  location.href = 'TraderPerformance.aspx?fdate='+ document.getElementById('fdate').value + '&tdate=' + document.getElementById('tdate').value + '&IsSoccer=' + document.getElementById('IsSoccer').value;
  }

</script>
