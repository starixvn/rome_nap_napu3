<thead>

	<th width ="120">Bet Type</th>
	<th colspan="3" width="300">Match</th>  
	<th width ="150">Base Currency</th>
</tr>
</thead>       

<tbody>
<!--Rows-->

	<td class="l" width ="140">{away}</td>
	<td class="b r">{base}</td>
</tr>
<!--/Rows-->
</tbody>
</table>
