<table class="tbllayout" cellspacing="1" width="380px">
<tr>
    <td colspan="4"><b>{Title}</b><br /></td>    
</tr>
<tr class="title" align="center">
  <td>{Date}</td>
  <td style="width:75px">{Super}</td>
  <td style="width:90px">{Master}</td>
  <td style="width:90px">{Agent}</td>  
</tr>
<!--Rows-->
<tr class="{odd_even}">
  <td align="center">{Date_vl}&nbsp</td>
  <td class="r">{Super_vl}</td>
  <td class="r">{Master_vl}</td>
  <td class="r">{Agent_vl}</td>  
</tr>
<!--/Rows-->
<!--Total-->
<tr class="report-footer">
  <td align="center">TOTAL</td>
  <td class="r">{Super_TT}</td>
  <td class="r">{Master_TT}</td>
  <td class="r">{Agent_TT}</td>  
</tr>
<!--/Total-->
</table>
