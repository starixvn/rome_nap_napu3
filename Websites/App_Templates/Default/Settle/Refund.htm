<center>
  <p></p>
	<table class="" style="margin-top: 5px;"  border="0px">
		<tr>
			<!--RefundFT-->
			<td >
				<input class="btn" type="button" tabindex="30" style="width: 130px; " value="Refund HT" onclick="DoCalculate('refundhalftime');"/>
			</td>
			<!--/RefundFT-->
			<td >
				<input type="button" class="btn" tabindex="31" {disableFT} style="width: 130px; " value="Refund FT" onclick="DoCalculate('refundfulltime');"/>
			</td>
			<td >
				<input type="button" class="btn" tabindex="32" style="width: 130px; " value="Refund All" onclick="DoCalculate('refund');"/>
			</td>      
      </tr>
      <tr>
        <!--MoveBetdaq-->
        <td>
            <input type="button" class="btn" id="btnMovebetdaq"  class="movebet" tabindex="33" style="width: 130px; " value="Move Betdaq Tickets" onclick="MoveBetdaqTickets('{matchID}', '{matchcode}');"/>
        </td>
        <!--/MoveBetdaq-->
        <!--RefundRunningBetDaqTickets-->		        
        <td colspan="2">
		    <input type="button"  id="btnRefundRunningBetDaqTickets" class="btn"  tabindex="34" style="width: 200px; " value="Refund Running BetDaq Tickets" onclick="RefundRunningBetDaq('{matchid}', '{matchcode}');"/>		         
		</td>
        <!--/RefundRunningBetDaqTickets-->
      </tr>
      <tr>
        <!--RefundMHT-->
		<td >
			<input type="button" class="btn" tabindex="35" style="width: 130px; " value="Refund Multiple HT" onclick="DoCal2('rht','{params}');"/>
		</td>
		<!--/RefundMHT-->
		<!--RefundFT-->
		<td >
			<input type="button" class="btn" tabindex="36" style="width: 130px; " value="Refund Multiple FT" onclick="DoCal2('rft','{params}');"/>
		</td>
		<!--/RefundFT-->
		<td >
			<input type="button" class="btn" tabindex="37" style="width: 130px; " value="Refund Multiple All" onclick="DoCal2('r','{params}');"/>
		</td>
      </tr>
      <!--ExcludeBetdaq-->
      <tr>
        <td colspan="3">
            <input class="hand" type="checkbox" id="chkIsExcludeBetdaq" name="chkIsExcludeBetdaq" /> Exclude Betdaq Tickets in Refund
        </td>
      </tr>
      <!--/ExcludeBetdaq-->
      <!--SettleDeterminedTickets-->
	  <tr>
		<td colspan="3">
			<input class="hand" type="checkbox" id="chkIsSettleDeterminedTickets" name="chkIsSettleDeterminedTickets" /> Settle determined tickets (Over/ Under)
		</td>
	  </tr>
	  <!--/SettleDeterminedTickets-->
	</table>
  <input type="hidden" id="IsRefund" name="IsRefund" value="1"></input>
</center>
