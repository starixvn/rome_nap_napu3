  <td class="htsc">{homeHT}</td>
  <td class="ftsc">{homeFT}</td>
  <td rowspan="2" {bgEventStatus}>{eventstatus}</td>  
  {calLink}

   <td rowspan="2">{betcnt}</td>

  <!--/confirmht-->
  <!--confirmft-->

  <!--/confirmft-->

<tr class="fs10 c {bgClass}">
  <td >
    <div onclick="ShowSettlementLog('{code}');" class="viewhis"></div>

  </td>
  <td class="b teamname at">{awayteam}&nbsp;{agoal}</td>
  <td class="htsc">{awayHT}</td>
  <td class="ftsc">{awayFT}</td>
