        <td id="td_hidden2">{todate}</td>
        <td  id="td_hidden3"><input type="checkbox" id="chkUnCal" name="chkUnCal" />Un-Calculate Game Only</td>

        <td id="td_hidden5" class="b">Leagues:</td>
        <td id="selLeague" class="width-350"><select id="ddlLeagues" name="ddlLeagues" class="fullwidth">{leagueOptions}</select></td>                   
        <!--/calc-->
