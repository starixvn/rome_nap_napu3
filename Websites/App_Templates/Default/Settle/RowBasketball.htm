<tr class="fs10 c {bgClass}">
  <td>{code}</td>  
  <td rowspan="2">{date}</td>
  <td class="b teamname ht">{homeTeam}</td>
  <td>{home1Q}</td>
  <td>{home2Q}</td> 
  <td>{home3Q}</td>
  <td>{home4Q}</td> 
  <td class="ot">{homeOT}</td>
  <td class="htsc">{homeHT}</td>
  <td class="ftsc">{homeFT}</td>  
  <td rowspan="2"{bgEventStatus}>{eventstatus}</td>  
  {calLink}
  <td rowspan="2"><!--confirmpendingread--><input type="checkbox" {ispending} disabled="disabled" /><!--/confirmpendingread--><!--confirmpendinghost--><input type="checkbox" {ispending} {displaypending} onclick="updateIsPending(this,'{matchid}');" /><!--/confirmpendinghost--></td>
  <!--confirmht-->
  <td rowspan="2">{confirmht}</td>
  <!--/confirmht-->
  <!--confirmft-->
  <td rowspan="2">{confirmft}</td>
  <!--/confirmft-->
</tr>
<tr class="fs10 c {bgClass}">
  <td> 
    <img onclick="ShowSettlementLog('{code}');" class="hand" src="../App_Themes/Images/icn_view.png" />
    <div class="undecided_{isdecided} {hand}"  {event} title="{ContentOfTooltip}"></div>
  </td>
  <td class="b teamname at">{awayTeam}</td>
  <td>{away1Q}</td>
  <td>{away2Q}</td>
  <td>{away3Q}</td>
  <td>{away4Q}</td> 
  <td class="ot">{awayOT}</td>
  <td class="htsc">{awayHT}</td>
  <td class="ftsc">{awayFT}</td>  
</tr>
