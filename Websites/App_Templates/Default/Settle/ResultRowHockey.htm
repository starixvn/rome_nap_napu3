<tr class="c {bgClass}">
  <td rowspan="2">{code}</td>  
  <td rowspan="2">{date}</td>
  <td class="b teamname ht">{homeTeam}</td>
  <td>{home1Q}</td>
  <td>{home2Q}</td>
  <td>{home3Q}</td>   
  <td class="htsc">{homeOT}</td>    
  <td class="ftsc">{homeFT}</td>  
  <td rowspan="2" {bgEventStatus}>{eventstatus}</td>
</tr>
<tr class="c {bgClass}">
  <td class="b teamname at">{awayTeam}</td>
  <td>{away1Q}</td>
  <td>{away2Q}</td>
  <td>{away3Q}</td> 
  <td class="htsc">{awayOT}</td>
  <td class="ftsc">{awayFT}</td>  
</tr>
