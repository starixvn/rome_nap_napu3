<table class="tblcollapse">
    <tbody>
        <tr class="title1">
            <td colspan="2" class="pad33 b" style="text-transform: uppercase">
                {sportname}
            </td>
            <td colspan="5" class="c">
                EVENT {eventdate}
            </td>
        </tr>
        <tr class="c title">
            <td width="150px" colspan="3">
                {lblRace}
            </td>
            <td width="210px">
                {lblResult}
            </td>
            <td width="60px">
                {lblWin}
            </td>
            <td width="60px">
                {lblPlace}
            </td>
            <td width="150px">
                {lblStatus}
            </td>
        </tr>
        <!--league-->
        <tr  class="title2">
            <td colspan="7">
                *..::¤&nbsp;{leaguename}&nbsp;¤::..*
            </td>
        </tr>
        <!--/league-->
        <!--row-->
        <!--info1-->
        <tr class="{bgClass} c">
            <td class="c b" style="width: 50px" rowspan="{totalplace}">
                {race}
            </td>
            <td class="htsc" style="width: 50px">
                {place}
            </td>
            <td class="c b" style="width: 50px; color: #003399">
                {horseno}
            </td>
            <td class="b l">
                {horsename}
            </td>
            <td class="c">
                {winodds}
            </td>
            <td class="c">
                {placeodds}
            </td>
            <td rowspan="{totalplace}" valign="top">
                <table style="width: 150px;" class="tblnoneboder">
                    <tr>
                        <td class="c b" style="color: #b50000">
                            {eventstatus}
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <table align="center" class="tblnoneboder">
                                <tr>
                                    <td class="l b">
                                        {lblSCR}:&nbsp;
                                    </td>
                                    <td class="l">
                                        {scr}
                                    </td>
                                </tr>
                                <tr>
                                    <td class="r b">
                                        {lblTF}:&nbsp;
                                    </td>
                                    <td class="l">
                                        {tf}
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <!--/info1-->
        <!--info2-->
        <tr class="c {bgClass}">
            <td class="htsc" style="width: 50px">
                {place}
            </td>
            <td class="c b l ht" style="width: 50px; color: #003399">
                {horseno}
            </td>
            <td class="b l">
                {horsename}
            </td>
            <td class="c">
                {winodds}
            </td>
            <td class="c">
                {placeodds}
            </td>
        </tr>
        <!--/info2-->
        <!--/row-->
    </tbody>
</table>
