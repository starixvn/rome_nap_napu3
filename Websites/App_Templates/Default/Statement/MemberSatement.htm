<table class="tbllayout" border="0"    cellspacing="1" id="rptMemberStatement">
<!--ReportHeader-->
    <thead>
        <tr class="title" style="text-align: center;">
            <th style="width:80px">Date</th>
            <th style="width: 300px;">Remark</th> 
            <th>Total</th> 
            <th>Accumulated Total</th>
            <!--Creator-->
            <th>Creator</th>
            <!--/Creator-->
            <th width="70px" class="verify">
                Verified by
            </th>
            <th width="80px" class="verify">
                Checked Time
            </th>
    </thead>
<!--/ReportHeader-->
<!--ReportContent-->
<tbody>
<tr class="{odd_even}">
    <td class="c"><span {link}>{Date}</span></td>
    <td class="l remark">{Remark}</td>
    <td {cssNegative} style="text-align:right;">{Total}</td>
    <td {OkClass} style="text-align:right;">{Total2}</td>
    <!--CreatorVL-->
    <td class="c">{Creator}</td>
    <!--/CreatorVL-->
     <td class="c">{verifiedby}</td>
    <td class="c">{checkedtime}</td>
</tr>
</tbody>
<!--/ReportContent-->
</table>
