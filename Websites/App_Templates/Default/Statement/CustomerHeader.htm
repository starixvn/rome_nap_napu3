<!--Link-->
<div>
    <!--StatementLink-->
    <a id='lkStatement' href="javascript:ViewCustomerStatement(1)">Statement</a>
    <!--/StatementLink-->
    <!--Statement-->
    <span id='titleStatement'>Statement</span>
    <!--/Statement-->
    &nbsp;&nbsp;|&nbsp;&nbsp;
    <!--DetailLink-->
    <a id='lkDetail' href="javascript:ViewCustomerStatement(3)">Detail</a>
    <!--/DetailLink-->
    <!--Detail-->
    <span id='titleDetail'>Detail</span>
    <!--/Detail-->
    <!--IsAgent-->
    <!--AuditLink-->
    &nbsp;&nbsp;|&nbsp;&nbsp;<a id='lkAudit' href="javascript:ViewCustomerStatement(4)">Audit</a>
    <!--/AuditLink-->
    <!--Audit-->
    &nbsp;&nbsp;|&nbsp;&nbsp;<span id='titleAudit'>Audit</span>
    <!--/Audit-->
    <!--/IsAgent-->
</div>
<!--/Link-->
<!--StatementHeader-->
<span>
    <input type="hidden" id="repno" value="{reportNo}" />
</span>
<table cellpadding="2" cellspacing="2" border="0">
    <tr>
        <td>
            Username:
        </td>
        <td>
            <input type="text" id="txtCustName" value="{custname}" class="form_top autocomp"
                onkeypress="return KeyPress(event);" autocomplete="off" style="background-color: #fff" />
        </td>
        <!--Calendar-->
        <td>
            From:
        </td>
        <td>
            <div>
                {FromDateCal}</div>
        </td>
        <td>
            To:
        </td>
        <td>
            <div>
                {ToDateCal}</div>
        </td>
        <!--/Calendar-->
        <td>
            <input id="btnSubmit" name="btnSubmit" type="button" value="Submit" class="btn" onclick="GetDataReport()" />
        </td>
        <td>
            <input id="btnReset" name="btnReset" type="button" value="Reset" class="btn" onclick="reset_date()" />
        </td>
        <td>
            <input id="btnExport" name="btnExport" title="Export to Excel" class='btnExcel' id='btnExport'
                name='btnExport' value='   ' onclick='ExportToExcel();' type='button' />
        </td>
        <td>
            <span id="notemessage" class="note-info-message" title=""></span>
        </td>
    </tr>
</table>
<!--/StatementHeader-->
