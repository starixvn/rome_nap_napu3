<table class="tbllayout" style="width:900px" cellspacing="1">
<!--ReportHeader-->
<tr class="title">
    <td class="c">Date</td> 
    <td class="c">Ref.no</td>
    <td class="c">Remark</td>
    <td class="c">Debit</td>
    <td class="c">Credit</td>
    <td class="c">Total</td>
    <td class="c">Creator</td>
    <!--DelHeader-->
    <td class="c">Del</td>
    <!--/DelHeader-->
</tr>
<!--/ReportHeader-->
<!--ReportContent-->
<tr class="{odd_even}" class="r">
    <td class="c">{Date}</td>
    <td class="l">&nbsp;{Refno}</td>
    <td class="l"><b>{Remark}</b></td>
    <td class="r">{Debit}</td>
    <td class="r">{Credit}</td>
    <td class="r">{Total}</td>
    <td align="center">{Creator}</td>
    
    <!--DelCol-->
    <td align="center">
    <!--DelLink-->
    <a href="#" onclick="DelTrans('{Refno}');">
      <img src="../App_Themes/Images/icon_del.gif" width="14px" border="0" />
    </a>
    <!--/DelLink-->
    </td>
    <!--/DelCol-->
</tr>
<!--/ReportContent-->

<!--ReportFooter-->
<tr class="title">
  <!--Excel-Footer-->  
  <td colspan="8" align="center">
  <!--/Excel-Footer-->
    Total: &nbsp;&nbsp;  {total}
  </td>
</tr>
<!--/ReportFooter-->
</table>
