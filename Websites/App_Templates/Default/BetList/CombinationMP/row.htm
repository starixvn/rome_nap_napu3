<tr>
    <!--wldate-->
    <td {row-spans}>
        <div style="width:60px">{Date}</div>
    </td>
    <!--/wldate-->
    <td>
        <div style="width:320px; padding-top:3px; padding-bottom:3px; text-align:left; padding-left:2px; overflow-x:hidden;">{Event}</div>
    </td>
    <td>
        <div style="width:50px; font-weight:bold; text-align:right"><span style="margin-right:3px">{Odds}</span></div>
    </td>
    <td>
        <div style="width:80px; font-weight:bold; text-align:right"><span style="margin-right:3px">{Stake}</span></div>
    </td>
    <td>
        <div style="width:100px; font-weight:bold; text-align:right">
            <span style="margin-right:3px;{wl-color}">{Win/Lost}</span>
            <br />
            <span style="margin-right:3px">{Comm}</span>
        </div>
    </td>
    <td>
        <div style="width:50px; font-weight:bold">{Status}</div>
    </td>
</tr>
