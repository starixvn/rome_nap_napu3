<table class="tbllayout" cellspacing="1" style="width:690px;" align="center">
    <tr class="l bl-leaguename" style="background-color:#DFEAFF">
        <th colspan="4" align="center">
            <span class="bl_time"><span class="b bl_stype">{lblSportName} - </span>&nbsp;<span class="b">{leaguename}</span></span>
        </th>
    </tr>
    <tr class="title">
        <td width="15%">
            {lblKickOffTime}
        </td>
        <td width="60%">
            {lblTeam}
        </td>
        <td width="10%">
            {lblFinalScore}
        </td>
        <td width="15%">
            {lblEventStatus}
        </td>
    </tr>
    <!--row-->
    <tr>
        <td rowspan="2" class="bl_time">
            {date}
        </td>
        <td class="l {hstyle}">
            {hometeam}
        </td>
        <td class="b c">
            {homeFScore}
        </td>
        <td class="b c {bgEventStatus}" rowspan="2">
            {eventstatus}
        </td>
    </tr>
    <tr>
        <td class="l {astyle}">
            {awayteam}
        </td>
        <td class="b c">
            {awayFScore}
        </td>
    </tr>
    <!--/row-->
</table>
